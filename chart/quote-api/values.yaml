image:
  repository: ghcr.io/onlylight/devops-takehome-solution/quote-api
  # Always a git-SHA tag that already exists on GHCR (never `latest`). Bumped by a Git commit; ArgoCD syncs it.
  tag: sha-037670c7999585b738119349795dc24bf3f9669a
  pullPolicy: IfNotPresent

service:
  port: 80

ingress:
  enabled: true
  className: traefik
  path: /
  # No host on purpose: `curl http://localhost:<port>/api/quote` must work from the reviewer's host.

# Each /api/quote request is ~100ms of CPU work, so CPU is what saturates (and what the HPA watches).
# Measured with this limit: one pod is stable up to ~4 req/s and collapses at 5. The HPA scales on a % of the
# REQUEST, so the request is sized to start scaling at about half of that capacity: 60% of 300m = 180m of CPU,
# roughly 1.8 req/s per pod. (With a 100m request the same 60% was only ~0.6 req/s per pod: scale-out far too early.)
resources:
  requests:
    cpu: 300m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi

# spec.replicas is deliberately NOT set on the Deployment: the HPA owns it.
# With ArgoCD selfHeal a hard-coded replica count would be reverted against the HPA.
autoscaling:
  minReplicas: 3
  maxReplicas: 8
  targetCPUUtilizationPercentage: 60

pdb:
  maxUnavailable: 1

# Scrape interval for the ServiceMonitor (only rendered when the Prometheus Operator CRDs exist).
serviceMonitor:
  interval: 15s

# Latency alert (templates/prometheusrule.yaml): why these numbers is explained in that file.
alert:
  p95Seconds: 0.5
  for: 2m

# SIGTERM -> app turns /readyz off, waits DRAIN_DELAY, then shuts down. Grace period must exceed both.
terminationGracePeriodSeconds: 30
drainDelay: 3s

# Placement: prefer spot, but always keep a replica on on-demand (see templates/deployment.yaml).
placement:
  capacityLabel: acme.io/capacity
  spotWeight: 100
  onDemandWeight: 10
  # Max difference in replica count between the spot and on-demand domains.
  capacityMaxSkew: 2
